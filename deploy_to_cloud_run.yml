name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          # The GCP project ID to deploy to. Store this as a secret in your GitHub repo.
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          # A JSON key for a service account with Cloud Run and Artifact Registry permissions.
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Google Container Registry
        run: gcloud auth configure-docker

      - name: Build and push Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/staff-performance-api:$GITHUB_SHA .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/staff-performance-api:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy staff-performance-api \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/staff-performance-api:$GITHUB_SHA \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}"